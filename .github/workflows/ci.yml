name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the code. No production secrets are used or needed.
permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]   # 3.14 = Ubuntu 26.04 (production); includes the documentation link checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      # Errors only: syntax errors and undefined names.
      - run: ruff check --select E9,F63,F7,F82 --output-format github bot db web yt tools tests

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: Ubuntu 24.04's apt package is 0.9.0, which also reports SC2015 on deliberate `a && b || true`.
      - run: pip install shellcheck-py==0.11.0.1
      - run: shellcheck --version && shellcheck -x -P deploy install.sh deploy/install.sh deploy/tgyt deploy/lib/*.sh

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists a pull request's commits through the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
