# Rendered to /etc/nginx/sites-available/tgyt.conf by deploy/install.sh, which fills in
# __PUBLIC_HOST__, __WEB_PORT__, __WEB_PORT_SUFFIX__, __SSL_CERT__ and __SSL_KEY__.
# (Initially the self-signed certificate; replaced by the Let's Encrypt certificate once issued.)
#
# Only used when OAUTH_MODE=hostname. In loopback mode uvicorn serves TLS itself (bot/main.py).

server {
    listen __WEB_PORT__ ssl;
    listen [::]:__WEB_PORT__ ssl;
    server_name __PUBLIC_HOST__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:tgyt_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Channel-linking uploads are small JSON files; nothing large ever goes through the panel.
    client_max_body_size 25m;

    # Live job progress (Server-Sent Events): must not be buffered or cut off by the proxy timeout.
    location = /events {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;

    # Let's Encrypt HTTP-01 challenge (certificate issuance and renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host__WEB_PORT_SUFFIX__$request_uri;
    }
}
